name: Release Indus

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: indus
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: indus
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: indus
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: indus
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: indus.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            executable: indus.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected="indus $(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$("target/${{ matrix.target }}/release/${{ matrix.executable }}" --version)" = "${expected}"

      - name: Verify Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $expected = "indus " + [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          $version = & "target/${{ matrix.target }}/release/${{ matrix.executable }}" --version
          if ($version -ne $expected) {
            throw "Unexpected release version: $version"
          }

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="indus-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${asset}"
          chmod 755 "dist/${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          else
            (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
          fi

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "indus-${{ matrix.target }}.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "dist/$asset.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: indus-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${version}"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match Cargo version ${version}." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -name '*.sha256' -print0 \
            | sort -z \
            | xargs -0 cat > dist/SHA256SUMS

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Indus ${RELEASE_TAG}" \
              --generate-notes
          fi

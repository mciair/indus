[package]
name = "indus"
version = "0.1.0"
edition = "2024"
description = "India's AI-native CLI"
license = "Proprietary"

[[bin]]
name = "indus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
crossterm = "0.28"
cron = "0.15"
html2text = "0.16"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
unicode-width = "0.2"
urlencoding = "2"

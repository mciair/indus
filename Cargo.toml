[package]
name = "indus"
version = "0.1.0"
edition = "2024"
description = "India's AI-native CLI"
license = "Proprietary"

[[bin]]
name = "indus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
